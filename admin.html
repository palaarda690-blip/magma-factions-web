<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magma Network | Yönetim Paneli</title>

    <!-- External Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Harici Ayrı CSS Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 selection:bg-rose-500 selection:text-white">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Başlık -->
        <div class="flex items-center justify-between pb-6 border-b border-zinc-800">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-600 to-amber-500 flex items-center justify-center font-teko text-3xl font-bold text-white shadow-lg glow-red">
                    M
                </div>
                <div>
                    <h1 class="font-teko text-4xl font-bold text-rose-500 uppercase leading-none">Magma Network Yönetim Paneli</h1>
                    <p class="text-xs text-zinc-400 mt-1">VIP fiyatlarını ve canlı bakım modunu buradan anında yönetebilirsin.</p>
                </div>
            </div>
            <a href="index.html" class="px-5 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm font-semibold hover:border-rose-500 hover:text-white text-zinc-300 transition flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-arrow-left"></i> Siteye Dön
            </a>
        </div>

        <!-- Yönetim Kartları -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Fiyat Yönetim Kartı -->
            <div class="bg-zinc-900/60 border border-zinc-800/90 p-6 rounded-3xl shadow-2xl flex flex-col justify-between">
                <div>
                    <h3 class="font-teko text-3xl font-bold mb-4 flex items-center gap-2.5 text-white">
                        <i class="fa-solid fa-tags text-amber-400"></i> VIP & Kasa Fiyatları (TL)
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">VIP Fiyatı</label>
                            <input type="number" id="input-vip" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">VIP+ Fiyatı</label>
                            <input type="number" id="input-vipplus" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">MVIP Fiyatı</label>
                            <input type="number" id="input-mvip" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">MVIP+ Fiyatı</label>
                            <input type="number" id="input-mvipplus" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
                        </div>
                    </div>
                </div>

                <button onclick="savePricesFromAdmin()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold font-teko text-2xl rounded-2xl transition shadow-lg mt-6">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Fiyatları Güncelle
                </button>
            </div>

            <!-- Bakım Modu Yönetimi -->
            <div class="bg-zinc-900/60 border border-zinc-800/90 p-6 rounded-3xl shadow-2xl flex flex-col justify-between">
                <div>
                    <h3 class="font-teko text-3xl font-bold mb-4 flex items-center gap-2.5 text-white">
                        <i class="fa-solid fa-screwdriver-wrench text-rose-500"></i> Bakım Modu Kontrolü
                    </h3>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between bg-zinc-950 p-4 rounded-2xl border border-zinc-800">
                            <div>
                                <span class="text-sm font-semibold text-white block">Bakım Modu Aktif mi?</span>
                                <span class="text-[11px] text-zinc-500">Açıldığında sitede tam ekran bakım ekranı görünür.</span>
                            </div>
                            <input type="checkbox" id="maintToggle" class="w-6 h-6 accent-rose-500 cursor-pointer rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">Tahmini Bakım Süresi (Dakika Cinsinden)</label>
                            <input type="number" id="maintDuration" placeholder="Örn: 15" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">Bakım Duyuru Mesajı</label>
                            <textarea id="maintMsg" rows="3" placeholder="Örn: Sunucumuzda bakım yapılmaktadır. En kısa sürede aktif olacağız!" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none focus:border-rose-500 transition resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <button onclick="saveMaintenanceFromAdmin()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white font-bold font-teko text-2xl rounded-2xl transition shadow-lg glow-red mt-6">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Bakım Ayarlarını Kaydet
                </button>
            </div>

        </div>
    </div>

    <!-- Harici Ayrı JS Dosyası -->
    <script src="script.js"></script>
</body>
</html>
